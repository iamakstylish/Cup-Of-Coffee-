<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cup Of Coffee - Order Online</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f3ee;
    color:#24170f;
}

header{
    background:#3b2114;
    color:white;
    padding:20px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:10;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:6px 0 0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:18px;
}

.category{
    font-size:22px;
    margin-top:25px;
}

.item{
    background:white;
    border-radius:14px;
    padding:15px;
    margin:12px 0;
    display:flex;
    justify-content:space-between;
    gap:15px;
    box-shadow:0 2px 10px #00000012;
}

.item h3{
    margin:0 0 6px;
}

.item p{
    margin:0;
    color:#666;
    font-size:14px;
}

.price{
    font-weight:bold;
    margin-top:8px;
}

button{
    border:none;
    border-radius:9px;
    padding:10px 15px;
    background:#6f3e21;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

.cart{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-top:25px;
    box-shadow:0 2px 10px #00000012;
}

.cart-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

input,
textarea{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:15px;
}

.total{
    font-size:20px;
    font-weight:bold;
    padding:15px 0;
}

.order-btn{
    width:100%;
    font-size:17px;
    padding:14px;
}

#message{
    display:none;
    padding:12px;
    margin-top:12px;
    border-radius:9px;
}

.success{
    background:#e7f7e7;
    color:#185b18;
}

.error{
    background:#ffe8e8;
    color:#8a1f1f;
}
</style>
</head>

<body>

<header>
    <h1>☕ Cup Of Coffee</h1>
    <p>Order Online</p>
</header>

<div class="container">

    <div id="menu"></div>

    <div class="cart">

        <h2>🛒 Your Cart</h2>

        <div id="cartItems">
            Cart is empty.
        </div>

        <div class="total">
            Total: ₹<span id="total">0</span>
        </div>

        <h2>Customer Details</h2>

        <input
            id="name"
            type="text"
            placeholder="Your Name"
        >

        <input
            id="phone"
            type="tel"
            placeholder="Mobile Number"
        >

        <textarea
            id="address"
            rows="3"
            placeholder="Delivery Address"
        ></textarea>

        <button
            class="order-btn"
            id="placeOrder"
        >
            Place Order
        </button>

        <div id="message"></div>

    </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyDuVWMltJCpPnW_RGWBnQZTXE_MtTy1sgs",

    authDomain:
    "cup-of-coffee-89146.firebaseapp.com",

    projectId:
    "cup-of-coffee-89146",

    storageBucket:
    "cup-of-coffee-89146.firebasestorage.app",

    messagingSenderId:
    "67162654268",

    appId:
    "1:67162654268:web:026929bf6dceb1f8156539",

    measurementId:
    "G-GHX74EQYLV"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   MENU
========================= */

const menu = [

    {
        id:"pizza",
        name:"Veg Pizza",
        price:249,
        category:"🍕 Pizza",
        description:"Cafe style cheesy veg pizza"
    },

    {
        id:"soyabean-pizza",
        name:"Soyabean Pizza",
        price:279,
        category:"🍕 Pizza",
        description:"Cheesy pizza with spicy soyabean topping"
    },

    {
        id:"sandwich",
        name:"Veg Sandwich",
        price:149,
        category:"🥪 Sandwich",
        description:"Fresh cafe style grilled sandwich"
    },

    {
        id:"pasta",
        name:"Pasta",
        price:300,
        category:"🍝 Pasta",
        description:"Creamy cafe style pasta"
    },

    {
        id:"cold-coffee-medium",
        name:"Cold Coffee Medium",
        price:149,
        category:"☕ Coffee",
        description:"Chilled creamy coffee with milk and vanilla ice cream"
    },

    {
        id:"cold-coffee-large",
        name:"Cold Coffee Large",
        price:189,
        category:"☕ Coffee",
        description:"Chilled creamy coffee with milk and vanilla ice cream"
    },

    {
        id:"choco-cold-coffee-medium",
        name:"Choco Cold Coffee Medium",
        price:169,
        category:"☕ Coffee",
        description:"Coffee blended with chocolate and served chilled"
    },

    {
        id:"choco-cold-coffee-large",
        name:"Choco Cold Coffee Large",
        price:199,
        category:"☕ Coffee",
        description:"Coffee blended with chocolate and served chilled"
    },

    {
        id:"oreo-cold-coffee",
        name:"Oreo Cold Coffee Large",
        price:199,
        category:"☕ Coffee",
        description:"Oreo biscuit and vanilla blended with chilled coffee"
    }

];


let cart = [];


/* =========================
   SHOW MENU
========================= */

const menuContainer =
document.getElementById("menu");


const categories =
[
    ...new Set(
        menu.map(item => item.category)
    )
];


categories.forEach(category => {

    const heading =
    document.createElement("h2");

    heading.className =
    "category";

    heading.textContent =
    category;

    menuContainer.appendChild(
        heading
    );


    menu
    .filter(item => item.category === category)
    .forEach(item => {

        const box =
        document.createElement("div");

        box.className =
        "item";

        box.innerHTML = `

            <div>

                <h3>
                    ${item.name}
                </h3>

                <p>
                    ${item.description}
                </p>

                <div class="price">
                    ₹${item.price}
                </div>

            </div>

            <button>
                Add
            </button>

        `;


        box
        .querySelector("button")
        .onclick = () => {

            addToCart(item);

        };


        menuContainer.appendChild(box);

    });

});


/* =========================
   ADD TO CART
========================= */

function addToCart(item){

    const existing =
    cart.find(
        product => product.id === item.id
    );


    if(existing){

        existing.quantity++;

    }else{

        cart.push({

            ...item,

            quantity:1

        });

    }


    displayCart();

}


/* =========================
   DISPLAY CART
========================= */

function displayCart(){

    const cartContainer =
    document.getElementById(
        "cartItems"
    );


    cartContainer.innerHTML = "";


    if(cart.length === 0){

        cartContainer.innerHTML =
        "Cart is empty.";

    }


    let total = 0;


    cart.forEach(item => {

        const subtotal =
        item.price *
        item.quantity;


        total += subtotal;


        const row =
        document.createElement("div");


        row.className =
        "cart-row";


        row.innerHTML = `

            <span>
                ${item.name}
                × ${item.quantity}
            </span>

            <span>
                ₹${subtotal}

                <button
                    style="padding:5px 9px"
                >
                    −
                </button>

            </span>

        `;


        row
        .querySelector("button")
        .onclick = () => {

            item.quantity--;

            if(item.quantity <= 0){

                cart =
                cart.filter(
                    x => x.id !== item.id
                );

            }

            displayCart();

        };


        cartContainer.appendChild(row);

    });


    document.getElementById(
        "total"
    ).textContent = total;

}


/* =========================
   PLACE ORDER
========================= */

document
.getElementById("placeOrder")
.addEventListener(
"click",
async function(){

    const name =
    document
    .getElementById("name")
    .value
    .trim();


    const phone =
    document
    .getElementById("phone")
    .value
    .trim();


    const address =
    document
    .getElementById("address")
    .value
    .trim();


    const message =
    document
    .getElementById("message");


    message.style.display =
    "block";


    if(
        cart.length === 0 ||
        !name ||
        !phone ||
        !address
    ){

        message.className =
        "error";

        message.textContent =
        "Please add items and fill all customer details.";

        return;

    }


    const total =
    cart.reduce(
        (sum,item) =>
        sum +
        item.price *
        item.quantity,
        0
    );


    try{

        const orderData = {

            customer:{

                name:name,

                phone:phone,

                address:address

            },

            items:

            cart.map(item => ({

                name:item.name,

                price:item.price,

                quantity:item.quantity

            })),

            total:total,

            status:"NEW",

            createdAt:
            serverTimestamp()

        };


        const orderRef =
        await addDoc(
            collection(
                db,
                "orders"
            ),
            orderData
        );


        message.className =
        "success";


        message.textContent =
        "Order successfully placed! Order ID: "
        +
        orderRef.id
        .slice(-6)
        .toUpperCase();


        cart = [];

        displayCart();


        document
        .getElementById("name")
        .value = "";


        document
        .getElementById("phone")
        .value = "";


        document
        .getElementById("address")
        .value = "";


    }catch(error){

        console.error(error);


        message.className =
        "error";


        message.textContent =
        "Order nahi ja saka. Firebase Rules check karein.";

    }

});

</script>

</body>
</html>
